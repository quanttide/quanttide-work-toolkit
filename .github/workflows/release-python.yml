name: release-python

on:
  push:
    tags:
      - 'python/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Python release tag to process, for example python/v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install uv
        run: python -m pip install uv

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            python/v*) ;;
            *) echo "expected a python/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#python/v}"
          grep -Fq "version = \"$VERSION\"" pyproject.toml
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/python/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install uv
        run: python -m pip install uv

      - name: build
        run: uv build --directory packages/python

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/python/dist
