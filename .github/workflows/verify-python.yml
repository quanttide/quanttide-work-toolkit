name: verify-python

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/verify-python.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest
