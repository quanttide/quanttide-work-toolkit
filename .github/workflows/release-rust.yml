name: release-rust

on:
  push:
    tags:
      - 'rust/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Rust release tag to process, for example rust/v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            rust/v*) ;;
            *) echo "expected a rust/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#rust/v}"
          grep -Fq "version = \"$VERSION\"" Cargo.toml
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

      # 契约：两侧（Rust 与 Dart）跑同一批向量，结论必须一样——一侧绿不算过
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub global activate coverage
      - name: contract（两侧向量一致）
        run: sh ../../scripts/contract.sh

      # 覆盖率（两侧行覆盖 ≥90%）与文档示例（每条示例都要有测试兜）
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sh ../../scripts/coverage.sh
      - run: sh ../../scripts/doc-tests.sh

      - run: cargo publish --dry-run --locked --registry crates-io

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/rust/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo publish --locked --registry crates-io

  # GitHub Release：注册表发布成功后，在仓库里补一条 Release（生成变更说明，预发布打标）。
  # 与 qtcloud-work 的 release-cli.yml 同路子：tag 是唯一事实源，Release 由 workflow 补上——
  # 无论 tag 怎么推上来（手动 push 或 qtcloud-devops release publish），Releases 页都不缺版本。
  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/rust/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes

      - name: mark prerelease when applicable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#rust/v}"
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
              ;;
          esac
