name: release-rust

on:
  push:
    tags:
      - 'rust/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Rust release tag to process, for example rust/v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            rust/v*) ;;
            *) echo "expected a rust/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#rust/v}"
          grep -Fq "version = \"$VERSION\"" Cargo.toml
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

      # 契约：两侧（Rust 与 Dart）跑同一批向量，结论必须一样——一侧绿不算过
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub global activate coverage
      - name: contract（两侧向量一致）
        run: sh ../../scripts/contract.sh

      # 覆盖率（两侧行覆盖 ≥90%）与文档示例（每条示例都要有测试兜）
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sh ../../scripts/coverage.sh
      - run: sh ../../scripts/doc-tests.sh

      - run: cargo publish --dry-run --locked --registry crates-io

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/rust/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo publish --locked --registry crates-io
