name: release-dart

on:
  push:
    tags:
      - 'dart/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Dart release tag to process, for example dart/v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            dart/v*) ;;
            *) echo "expected a dart/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#dart/v}"
          grep -Fq "version: $VERSION" pubspec.yaml
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: dart pub get
      - run: dart analyze lib/ test/
      - run: dart test
      - run: dart pub publish --dry-run

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/dart/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: publish to pub.dev
        env:
          # 凭证两种形状都认：整份 credentials.json（取里面的 accessToken），或者就是一个 token
          PUBDEV_CREDENTIAL_JSON: ${{ secrets.PUBDEV_CREDENTIAL_JSON }}
        run: |
          test -n "$PUBDEV_CREDENTIAL_JSON" || { echo "PUBDEV_CREDENTIAL_JSON secret is required" >&2; exit 1; }

          # 用 pub 自己的 token 仓（新版 pub 读的是 pub-tokens.json，不是那份 credentials.json——
          # 这一步以前挂在认证上，就是因为它把整份 JSON 写进了 credentials.json，pub 根本没看）
          TOKEN=$(python3 - <<'INNER'
          import json, os
          raw = os.environ["PUBDEV_CREDENTIAL_JSON"].strip()
          try:
              data = json.loads(raw)
              print(data.get("accessToken") or data.get("token") or "")
          except Exception:
              print(raw)
          INNER
          )
          if [ -z "$TOKEN" ]; then
            echo "从 PUBDEV_CREDENTIAL_JSON 里取不到 accessToken，也不是一个裸 token" >&2
            exit 1
          fi
          printf '%s' "$TOKEN" > /tmp/pub-token
          dart pub token add https://pub.dev --env-var PUB_TOKEN < /dev/null <<< "PUB_TOKEN=$(cat /tmp/pub-token)"
          rm -f /tmp/pub-token

          timeout 300 dart pub publish --force < /dev/null
