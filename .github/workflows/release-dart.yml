name: release-dart

on:
  push:
    tags:
      - 'dart/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Dart release tag to process, for example dart/v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            dart/v*) ;;
            *) echo "expected a dart/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#dart/v}"
          grep -Fq "version: $VERSION" pubspec.yaml
          grep -Fq "## [v$VERSION]" CHANGELOG.md || grep -Fq "## [$VERSION]" CHANGELOG.md

      - run: dart pub get
      - run: dart analyze lib/ test/
      - run: dart test
      - run: dart pub publish --dry-run

  publish:
    needs: quality-gates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/dart/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: publish to pub.dev
        env:
          # 凭证是 pub 的 credentials.json 全文，落在 pub 缓存里
          PUBDEV_CREDENTIAL_JSON: ${{ secrets.PUBDEV_CREDENTIAL_JSON }}
        run: |
          test -n "$PUBDEV_CREDENTIAL_JSON" || { echo "PUBDEV_CREDENTIAL_JSON secret is required" >&2; exit 1; }
          mkdir -p "$HOME/.pub-cache"
          printf '%s' "$PUBDEV_CREDENTIAL_JSON" > "$HOME/.pub-cache/credentials.json"
          dart pub publish --force
